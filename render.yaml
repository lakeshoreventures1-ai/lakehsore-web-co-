# One-click deploy of the backend on Render (render.com -> New -> Blueprint -> pick this repo).
# Fill in the "sync: false" values in Render's dashboard when prompted.
services:
  - type: web
    name: cnd-backend
    runtime: node
    rootDir: backend
    plan: starter            # needs an always-on instance + persistent disk (~$7/mo + $0.25/GB)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SITE_URL
        value: https://cnddigital.org
      - key: TRIAL_DAYS
        value: "30"
      - key: OUTREACH_TZ
        value: America/Chicago
      - key: OUTREACH_DAILY_LIMIT
        value: "30"
      - key: OUTREACH_AUTOSEND
        value: "0"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PHYSICAL_ADDRESS
        sync: false
      - key: CALENDLY_URL
        value: https://calendly.com/lakeshoreventures1/30min
